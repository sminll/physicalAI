name: noise-diary

# noise-diary 폴더(또는 이 파일)가 바뀔 때만 실행
on:
  push:
    branches: [main]
    paths:
      - "noise-diary/**"
      - ".github/workflows/noise-diary.yml"
  pull_request:
    branches: [main]
    paths:
      - "noise-diary/**"
      - ".github/workflows/noise-diary.yml"

jobs:
  # 1) 서버·DB 테스트
  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noise-diary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -v test_noise.py

  # 2) ESP32 펌웨어가 컴파일되는지 확인
  firmware-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noise-diary
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-2.0.17

      - name: Install ESP32 core 2.0.17 (PC와 같은 버전)
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Install Edge Impulse model library
        run: |
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install --zip-path lib/*.zip

      - name: Use example secrets (진짜 와이파이 정보는 깃허브에 없음)
        run: cp classifier/secrets.example.h classifier/secrets.h

      - name: Compile recorder
        run: arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32S3 recorder

      - name: Compile classifier
        run: arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32S3 classifier
